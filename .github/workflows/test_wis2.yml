name: "ECMWF-IFS 12Z" 

on:
  schedule:
    ### Starts early (e.g., 18:30 UTC) to actively wait for the 12Z data release window
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual execution from the GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    
    steps:
      - name: Get current date
        id: date
        run: echo "START_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MQTT Client Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto-clients jq

      - name: Wait for WIS2 12Z Signal
        id: wait_for_data
        timeout-minutes: 120 # Failsafe constraint: kills the run if 12Z doesn't arrive within 2 hours
        run: |
          echo "Connecting to WIS2 Global Broker..."
          echo "Subscribed and idling for the ECMWF 12Z Run notification..."
          
          # Subscribing specifically to the 12Z forecast cycle route
          RAW_PAYLOAD=$(mosquitto_sub \
            -h "gb.wis.cma.cn" \
            -p 8883 \
            -u "everyone" \
            -P "everyone" \
            -t "cache/a/wis2/int-ecmwf/data/core/weather/prediction/forecast/medium-range/deterministic/grib2/latitude-longitude/12/#" \
            -C 1)
            
          echo "12Z Signal received successfully!"
          
          # Extracts the canonical URL path out of the notification object
          DATA_URL=$(echo "$RAW_PAYLOAD" | jq -r '.links[] | select(.rel=="canonical").href')
          echo "Target Data URL: $DATA_URL"
          
          # Exposing the URL to the environment matrix if your PBS script needs to parse it
          echo "wis2_url=$DATA_URL" >> $GITHUB_OUTPUT

      - name: Download data and create fields
        uses: appleboy/ssh-action@v0.1.7
        with:
          command_timeout: 235m
          debug: True
          host: gadi.nci.org.au
          username: ${{ secrets.GADI_USER }}
          key: ${{ secrets.GADI_KEY }}
          passphrase: ${{ secrets.GADI_KEY_PASSPHRASE }}
          # You can optionally pass the ${{ steps.wait_for_data.outputs.wis2_url }} to your script if required
          script: |
            cd /home/565/mb0427/gdata-gb02/Website/Forecasts/ops_scripts/ECMWF/
            ./run_ECMWF_IFS.PBS
