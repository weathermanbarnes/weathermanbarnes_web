name: "ECMWF-eIFS 12Z" 

on:
  schedule:
    ### Starts early (e.g., 18:30 UTC) to actively poll for the 12Z data release window
    - cron: '49 18 * * *'
  workflow_dispatch: # Allows manual execution from the GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Get current date
        id: date
        run: echo "START_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ECMWF Client
        run: pip install ecmwf-opendata

      - name: Poll and Fetch Latest 12Z Data
        timeout-minutes: 240 # Failsafe constraint: kills the run if 12Z doesn't arrive within 2 hours
        run: |
          python -c "
          import time
          import sys
          from ecmwf.opendata import Client
          client = Client(source='ecmwf', model='ifs', resol='0p25')
          
          print('Starting live polling for the latest 12Z ECMWF-IFS data run...')
          
          while True:
              try:
                  # Pulls the 12 UTC run for the current operational date tracker
                  client.retrieve(
                      date=0,                 # 0 means 'today'. Change to -1 if checking for previous day.
                      time=12,                # Explicitly looking for the 12Z run
                      step=12,               # Your forecast step requirement
                      stream='enfo',          
                      type='fc',              
                      target='latest_eifs.grib'
                  )
                  print('Successfully detected and downloaded the latest 12Z run data!')
                  break
              except Exception as e:
                  # If the 12Z run hasn't been uploaded yet, the API raises an error
                  print(f'12Z data not ready yet. Retrying in 5 minutes... (Error context: {e})')
                  time.sleep(300) # Sleep for 300 seconds (5 minutes)
          "
      - name: Download data and create fields
        uses: appleboy/ssh-action@v0.1.7
        with:
          command_timeout: 181m
          debug: True
          host: gadi.nci.org.au
          username: ${{ secrets.GADI_USER }}
          key: ${{ secrets.GADI_KEY }}
          passphrase: ${{ secrets.GADI_KEY_PASSPHRASE }}
          script: |
            cd /home/565/mb0427/gdata-gb02/Website/Forecasts/ops_scripts/ECMWF/
            ./run_ECMWF_eIFS.PBS
